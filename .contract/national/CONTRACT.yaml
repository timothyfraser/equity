decisions:
  ND1: 'National section ranks MPOs; emissions weighting kept (Tim, 2026-11-20: ''we''re not going to do it at the county
    level and cancel out the emissions term'')'
  ND2: 'Goes into the JTG paper (Tim, 2026-11-20: Add to this paper)'
  ND3: Equal-group index stays the headline; population-weighted and small-group robustness (groups >= 1,000) beside it (Tim's
    fairness justification, 2026-11-20)
  ND4: 'SUPERSEDED by ND11. Road-type weighting: split county emissions by CAT by=15 road types and match TIGER road classes;
    apply to New York too, gate G1 before it replaces the paper''s headline (Tim, 2026-11-20: Yes, use road types)'
  ND5: Ranked chart includes multi-county MPOs only; single-county MPOs computed and listed in the table (Tim, 2026-11-20)
  ND6: 'Data access: Tim added www2.census.gov, geodata.bts.gov, services.arcgis.com in environment Settings; all return 200
    (2026-11-20)'
  ND7: 'Planning units may use Fable (Tim, 2026-11-20: ''Use Fable to plan''); implementation units stay Opus/Sonnet.'
  ND8: 'SUPERSEDED by ND11. Road-type split comes from the modern CAT runs only, 2022 and 2023 (MOVES Anywhere style); 2020
    runs reflect older MOVES road-type distributions and are not used for the split (Tim, 2026-11-20). Coverage measured 2026-11-20
    from year/2022.parquet and year/2023.parquet: 749 and 768 counties, union 954 of ~3,100, all 50 states. Counties with
    neither year need a fallback split; N-014 proposes one, Tim rules (Q4).'
  ND9: SUPERSEDED by ND11. Off-network emissions are spread over the four road classes (Tim, 2026-11-20).
  ND10: MPO chart ranks by the equal-group index with a marker for groups under 1,000 residents (Tim, 2026-11-20).
  ND11: 'Road-type split dropped (Tim, 2026-11-20: ''there isn''t a clear mapping of roadways onto urban, rural, and let alone
    urban restricted, urban unrestricted, rural restricted, and rural unrestricted roads ... I would skip doing the road type
    split''). Supersedes ND4, ND8, ND9 and gate G1; the national ranking and New York keep the county emissions rate (Eq.
    7) on by=16 totals. N-013..N-016 cancelled.'
  ND12: 'Equal-group index is the national headline; population-weighted is only the reviewer-facing companion; the size caveat
    goes in the text (Tim, 2026-11-20: ''Equal group matters. That is the point of this method.'').'
  ND13: 'Ranked bar chart retired (Tim, 2026-11-20: ''totally unreasonable and unreadable''); replaced by a four-panel figure,
    two tile-grid maps and two index-vs-emissions scatters with fitted curves. Full ranking stays as a supplementary table.'
  ND14: 'Run the missing CAT counties on Cloud MOVES, all orders at once (Tim, 2026-11-20). Blocked on a sign-in token for
    the private API: see PLAN_VIZ_AND_CAT.md section 1.1.'
  ND15: Scatter x = emissions per capita, log scale labelled in original units (kg per resident); one model index ~ log(rate).
    New York keeps its total-emissions figure (Tim, 2026-11-20).
  ND16: Tile map is one cohesive US-shaped block; no state labels on tiles; not sized by population (Tim, 2026-11-20).
  ND17: Map title "<Index> equity index per metropolitan planning organization"; subtitle "One tile per MPO, arranged nearest
    its location."; legend titled with the index name.
  ND18: 'Scatters: clear titles, no subtitle, y-axis titles; annotation with Greek beta, SE, p exact to 0.001 or "p < 0.001";
    no GAM, no second model.'
  ND19: SUPERSEDED in part by ND25 (scatters no longer share the 0.70 floor). Race and income share one 0.70-1.00 scale in
    maps and scatters.
  ND20: Most and least equal MPO outlined in black on each map with a leader line to "<name>, <state> (index)"; ringed in
    the matching scatter.
  ND21: 'Replication data rule: no raw CAT emissions in GitHub; store produced values (indices, MPO totals) plus query URLs
    and manifest; note that CAT values may change slightly over time.'
  ND22: 'Paper section "Scaling up": 2-3 paragraphs at the end of Results, written after the CAT runs land.'
  ND23: 'CAT orders placed by Tim''s local CAT session from .contract/national/CAT_ORDERS_HANDOFF.md: 61 counties (37 with
    only a 2020 run + 24 NY), year 2022, no Puerto Rico.'
  ND24: 'Map layout: square tiles, state abbreviation on every tile, the two maps side by side above the two scatters (Tim,
    2026-11-20); extremes labels above/below the map.'
  ND25: Scatter y-axes use the data extent; both maps keep the shared 0.70-1.00 colour scale (Tim confirmed, Q1).
  ND26: Ordinary SEs, reported as 95% confidence intervals (done 2026-11-20).
  ND27: Run the exact permutation test (random allocation of group labels, fixed margins); report "x of 224 MPOs are significantly
    more uneven in emissions burden by race than we would expect by chance".
  ND28: Run ACS sampling-error intervals (parametric bootstrap on tract MOEs).
  ND29: Write the national "Scaling up" section now with the permutation and ACS clarifications; analysis reproducible, commented,
    in Tim's style, tested.
  ND30: Methods gets a short subsubsection "Scaling Up to Metropolitan Planning Organizations" (Tim, Q2).
  ND31: 'Permutation test headline: raw count with p0 < 0.05, no multiplicity adjustment (Tim, Q3: "I don''t think adj is
    necessary").'
  ND32: ACS draws hold zero-estimate cells at 0 (Tim, Q4).
  ND33: 'On-the-line MPO per map: within the IQR of log emissions per resident and of the index, not an extreme, smallest
    absolute OLS residual (ties: larger population); highlighted on maps (dashed) and in scatters (diamond).'
  ND34: 'Figure layout: maps in the left column (race above income, about 62% of width), scatters in the right column; square
    tiles.'
  ND35: Single-county MPOs excluded because the method compares counties with different emissions rates; reasoning lives in
    Methods.
  ND36: New York permutation and Mohawk Valley chance expectation reported in Results, not Methods.
  ND37: No statistics in Results that Methods does not introduce (no Spearman, no size-gradient sentences).
  ND38: 'ACS sentence: for the median MPO, sampling error moves its index within a 95% range of x on race, ...'
  ND39: Report counts of MPOs below 0.95 and 0.90 for race and income.
  ND40: Place names as "in Virginia's Staunton-Augusta-Waynesboro MPO".
  ND41: Three decimals everywhere; p as "p = 0.044" or "p < 0.001"; a non-zero value rounding to 0.000 shows one significant
    figure.
  ND42: 'Citations verified: Carrington and Troske 1997 (DOI 10.1080/07350015.1997.10524718), Patefield 1981 (DOI 10.2307/2346669),
    BTS NTAD MPO layer (geodata.bts.gov, 200).'
  ND43: National figure placed before the Scaling Up subsection with \FloatBarrier.
  ND44: 'Scaling Up methods rewritten in plain language (T-015, paper commit f58f65a): no Connecticut detail in the text (the
    crosswalk stays in the code); chance-adjusted index explained in words with the formula in parentheses (Tim, 2026-11-21).'
