  revision: 3
  repo: timothyfraser/equity (branch dev)
  status: proposed (revision 3 + ND11, 2026-11-20); all questions ruled; waiting on Tim go for Wave 1
decisions:
  ND1: 'National section ranks MPOs; emissions weighting kept (Tim, 2026-11-20: ''we''re not going to do it at the county
    level and cancel out the emissions term'')'
  ND2: 'Goes into the JTG paper (Tim, 2026-11-20: Add to this paper)'
  ND3: Equal-group index stays the headline; population-weighted and small-group robustness (groups >= 1,000) beside it (Tim's
    fairness justification, 2026-11-20)
  ND4: 'SUPERSEDED by ND11. Road-type weighting: split county emissions by CAT by=15 road types and match TIGER road classes;
    apply to New York too, gate G1 before it replaces the paper''s headline (Tim, 2026-11-20: Yes, use road types)'
  ND5: Ranked chart includes multi-county MPOs only; single-county MPOs computed and listed in the table (Tim, 2026-11-20)
  ND6: 'Data access: Tim added www2.census.gov, geodata.bts.gov, services.arcgis.com in environment Settings; all return 200
    (2026-11-20)'
  ND7: 'Planning units may use Fable (Tim, 2026-11-20: ''Use Fable to plan''); implementation units stay Opus/Sonnet.'
  ND8: 'SUPERSEDED by ND11. Road-type split comes from the modern CAT runs only, 2022 and 2023 (MOVES Anywhere style); 2020
    runs reflect older MOVES road-type distributions and are not used for the split (Tim, 2026-11-20). Coverage measured 2026-11-20
    from year/2022.parquet and year/2023.parquet: 749 and 768 counties, union 954 of ~3,100, all 50 states. Counties with
    neither year need a fallback split; N-014 proposes one, Tim rules (Q4).'
  ND9: SUPERSEDED by ND11. Off-network emissions are spread over the four road classes (Tim, 2026-11-20).
  ND10: MPO chart ranks by the equal-group index with a marker for groups under 1,000 residents (Tim, 2026-11-20).
  ND11: 'Road-type split dropped (Tim, 2026-11-20: ''there isn''t a clear mapping of roadways onto urban, rural, and let alone
    urban restricted, urban unrestricted, rural restricted, and rural unrestricted roads ... I would skip doing the road type
    split''). Supersedes ND4, ND8, ND9 and gate G1; the national ranking and New York keep the county emissions rate (Eq.
    7) on by=16 totals. N-013..N-016 cancelled.'
gates:
  G1: Removed by ND11 (no road-type variant).
